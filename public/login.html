<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicia sesión en TicketFlow, el sistema de soporte interno de Bytenova." />
  <title>Iniciar sesión — TicketFlow</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <span class="auth-card__logo">TicketFlow</span>
    <p class="auth-card__subtitle">Sistema de soporte — Bytenova</p>

    <h1>Iniciar sesión</h1>

    <div id="msg-error" class="msg msg--error" role="alert"></div>
    <div id="msg-info"  class="msg msg--info"  role="status"></div>

    <form id="form-login" novalidate>
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          autocomplete="email"
          required
          placeholder="tu@correo.com"
        />
      </div>

      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input
          type="password"
          id="clave"
          name="clave"
          autocomplete="current-password"
          required
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        id="btn-submit"
        class="btn btn-primary btn-full"
      >
        Entrar
      </button>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta?
      <a href="registro.html">Registrarse</a>
    </p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
